# 发布 Release 时自动构建 Windows 产物，并把构建产物与风灵月影修改器一起上传到该 Release。
#
# 触发: 在 GitHub 上 Publish release（草稿发布 / 直接创建正式 release）。
# 产物:
#   1. OriTrainer.exe —— 原版修改器（mono 注入，x86，.NET Framework 4.8）
#   2. OriTrainerDE.exe —— 终极版修改器（mono 注入，x86，.NET Framework 4.8，-p:Edition=DE）
#   3. 风灵月影《奥日与黑暗森林：终极版》v1.0 Plus 13 修改器（随仓库分发的第三方工具）
#
# 说明:
#   - 构建直接复用 publish.ps1 / publish-DE.ps1（Release 发布构建）；
#   - 两版共用同一套 bin/obj，切换 Edition 会把另一版的输出清掉，
#     所以每版构建完立刻把 exe 复制到独立暂存目录，最后一起上传；
#   - 上传用 runner 预装的 gh CLI，凭 GITHUB_TOKEN（由 contents: write 授予），
#     不引入第三方 action；
#   - --clobber 允许重跑/重发时覆盖同名资产。
name: Release

on:
  release:
    types: [published]

# 上传 Release 资产需要写权限
permissions:
  contents: write

# 同一 tag 的发布只保留一次运行（避免重复上传互相覆盖）
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: 构建并上传 Windows 产物
    runs-on: windows-latest
    env:
      # 第三方修改器（路径含空格，引用时注意加引号）
      TRAINER: "Ori and the Blind Forest Definitive Edition v1.0 Plus 13 Trainer.exe"
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 与本地开发环境一致：net35（注入载荷）与 net48（修改器 exe）都靠它编译
          dotnet-version: 10.0.x

      - name: 构建原版修改器并暂存产物
        shell: pwsh
        working-directory: OriTrainer
        run: |
          ./publish.ps1
          # pwsh 默认不因原生命令失败而中断步骤：publish 失败时 $LASTEXITCODE 非 0，
          # 若继续复制会把上一版构建残留的旧 exe 顶替上传，所以失败必须显式抛错。
          if ($LASTEXITCODE -ne 0) { throw "publish.ps1 构建失败（退出码 $LASTEXITCODE）" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\artifacts" | Out-Null
          Copy-Item "src\OriTrainer\bin\Release\net48\win-x86\publish\OriTrainer.exe" "$env:RUNNER_TEMP\artifacts\" -Force

      - name: 构建终极版修改器并暂存产物
        shell: pwsh
        working-directory: OriTrainer
        run: |
          ./publish-DE.ps1
          if ($LASTEXITCODE -ne 0) { throw "publish-DE.ps1 构建失败（退出码 $LASTEXITCODE）" }
          Copy-Item "src\OriTrainer\bin\Release\net48\win-x86\publish\OriTrainerDE.exe" "$env:RUNNER_TEMP\artifacts\" -Force

      - name: 确认第三方修改器随仓库存在
        shell: pwsh
        run: |
          if (-not (Test-Path "$TRAINER")) {
            throw "仓库中未找到 $TRAINER（它应被 .gitignore 白名单保留并已提交）"
          }

      - name: 打印校验和（便于在 Release 说明里附上）
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 `
            "$env:RUNNER_TEMP\artifacts\OriTrainer.exe", `
            "$env:RUNNER_TEMP\artifacts\OriTrainerDE.exe", `
            "$TRAINER" `
            | Format-Table Path, Hash -AutoSize

      - name: 上传到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          Write-Host "上传资产到 release: $tag"
          gh release upload $tag @(
            "$env:RUNNER_TEMP\artifacts\OriTrainer.exe",
            "$env:RUNNER_TEMP\artifacts\OriTrainerDE.exe",
            "$TRAINER"
          ) --clobber
          Write-Host "--- 当前资产 ---"
          gh release view "$tag" --json assets --jq '.assets[].name'
